<div [class]="'relative flex items-center gap-2 bg-card border border-border/80 rounded-lg px-3 py-1.5 focus-within:ring-1 focus-within:ring-ring focus-within:border-primary/60 transition-all shadow-sm ' + containerClass">
  <app-icon name="search" class="w-4 h-4 text-muted-foreground shrink-0" />
  <input
    type="text"
    [value]="value"
    [placeholder]="placeholder"
    [attr.aria-label]="placeholder || 'Buscar...'"
    (input)="onInput($event)"
    class="w-full bg-transparent text-xs text-foreground placeholder:text-muted-foreground font-medium focus:outline-none border-none p-0 h-auto"
  />
</div>
