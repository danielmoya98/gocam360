<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shrink-0">
  <div>
    @if (badgeText || backLinkUrl) {
      <div class="flex items-center gap-2 mb-1">
        @if (backLinkUrl) {
          <a [href]="backLinkUrl" class="inline-flex items-center gap-1 text-xs font-semibold text-primary hover:underline">
            ← {{ backLinkLabel }}
          </a>
          @if (badgeText) {
            <span class="text-xs text-muted-foreground">•</span>
          }
        }

        @if (badgeText) {
          <span
            class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold font-mono border inline-flex items-center gap-1"
            [class.bg-emerald-500\/10]="badgeVariant === 'emerald'"
            [class.text-emerald-400]="badgeVariant === 'emerald'"
            [class.border-emerald-500\/20]="badgeVariant === 'emerald'"
            [class.bg-amber-500\/10]="badgeVariant === 'amber'"
            [class.text-amber-400]="badgeVariant === 'amber'"
            [class.border-amber-500\/20]="badgeVariant === 'amber'"
            [class.bg-rose-500\/10]="badgeVariant === 'rose'"
            [class.text-rose-400]="badgeVariant === 'rose'"
            [class.border-rose-500\/20]="badgeVariant === 'rose'"
            [class.bg-primary\/10]="badgeVariant === 'primary'"
            [class.text-primary]="badgeVariant === 'primary'"
            [class.border-primary\/20]="badgeVariant === 'primary'"
            [class.bg-muted]="badgeVariant === 'muted'"
            [class.text-muted-foreground]="badgeVariant === 'muted'"
            [class.border-border]="badgeVariant === 'muted'"
          >
            {{ badgeText }}
          </span>
        }
      </div>
    }

    <h2 class="text-xl font-bold tracking-tight text-foreground">{{ title }}</h2>
    @if (subtitle) {
      <p class="text-xs text-muted-foreground mt-0.5 leading-relaxed">{{ subtitle }}</p>
    }
  </div>

  <div class="flex items-center gap-2 shrink-0">
    <ng-content select="[actions]" />
  </div>
</div>
